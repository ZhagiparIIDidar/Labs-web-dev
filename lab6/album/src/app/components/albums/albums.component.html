<ul class="list-group">
    <li class="list-group-item d-flex justify-content-between align-items-center" *ngFor="let album of albums">
        <a [routerLink]="['/albums', album.id, 'photos']">{{ album.id }} - {{ album.title }}</a>
        <button class="btn btn-sm btn-danger" (click)="delete(album.id)">Delete</button>
    </li>
    <li class="list-group-item text-muted" *ngIf="albums.length === 0">No albums found.</li>
</ul>
