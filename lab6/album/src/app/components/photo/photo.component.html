<div>
    <div class="d-flex align-items-center mb-2">
        <h4 class="me-3" *ngIf="albumId">Photos for album {{ albumId }}</h4>
        <!-- <label class="me-2 mb-0">Count:</label> -->
        <select class="form-select form-select-sm w-auto" [(ngModel)]="limit">
            <option [ngValue]="5">5</option>
            <option [ngValue]="10">10</option>
            <option [ngValue]="20">20</option>
            <option [ngValue]="50">50</option>
            <option [ngValue]="100">100</option>
            <option [ngValue]="0">All</option>
        </select>
    </div>
    <div class="row">
        <div class="col-6 col-md-4 col-lg-3 mb-3" *ngFor="let photo of photos">
            <div class="card">
                <img [src]="photo.thumbnailUrl" class="card-img-top" [alt]="photo.title" />
                <div class="card-body p-2">
                    <p class="card-text small text-truncate" title="{{ photo.title }}">{{ photo.title }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
