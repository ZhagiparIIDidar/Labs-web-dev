<div>
    <div class="mb-3">
        <h5>Add Photo</h5>
        <div class="input-group">
            <input class="form-control" placeholder="Title" [(ngModel)]="newPhotoTitle" />
            <input class="form-control" placeholder="Image URL" [(ngModel)]="newPhotoUrl" />
            <button class="btn btn-success" (click)="addPhoto()"
                [disabled]="!newPhotoTitle || !newPhotoUrl">Add</button>
        </div>
    </div>

    <div class="row">
        <div class="col-6 col-md-4 col-lg-3 mb-3" *ngFor="let photo of photos">
            <div class="card">
                <img [src]="photo.thumbnailUrl" class="card-img-top" [alt]="photo.title" />
                <div class="card-body p-2">
                    <p class="card-text small text-truncate" title="{{ photo.title }}">{{ photo.title }}</p>
                </div>
            </div>
        </div>
    </div>
    <button class="btn btn-secondary" (click)="back()">Back</button>
</div>
