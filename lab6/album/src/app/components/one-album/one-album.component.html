<div *ngIf="album">
    <h2>Album {{ album.id }}</h2>
    <p><strong>User ID:</strong> {{ album.userId }}</p>
    <div class="mb-3">
        <label for="titleInput" class="form-label">Title</label>
        <input id="titleInput" [(ngModel)]="titleInput" class="form-control" />
    </div>
    <button class="btn btn-primary me-2" (click)="save()">Save</button>
    <button class="btn btn-secondary me-2" (click)="back()">Back</button>
    <a class="btn btn-info" [routerLink]="['/albums', album.id, 'photos']">View Photos</a>

    <!-- inline photos grid -->
    <div class="mt-4">
        <h4>Photos</h4>
        <div class="row">
            <div class="col-6 col-md-4 col-lg-3 mb-3" *ngFor="let photo of photos">
                <div class="card">
                    <img [src]="photo.thumbnailUrl" class="card-img-top" [alt]="photo.title" />
                    <div class="card-body p-2">
                        <p class="card-text small text-truncate" title="{{ photo.title }}">{{ photo.title }}</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<p *ngIf="!album" class="text-muted">Album not found.</p>
