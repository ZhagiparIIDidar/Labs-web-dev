<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HTML Syntax</title>
</head>
<body>

<h1>HTML Syntax</h1>

<h2>Headings</h2>
<h1>Heading 1</h1>
<h2>Heading 2</h2>
<h3>Heading 3</h3>

<h2>Paragraphs and Links</h2>
<p>This is a paragraph.</p>
<a href="https://example.com">This is a link</a>

<h2>Images and Lists</h2>
<img src="image.jpg" alt="Example">
<ul>
  <li>Item 1</li>
  <li>Item 2</li>
</ul>

</body>
</html>
