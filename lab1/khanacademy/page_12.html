<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Great big font sizes</title>
<style>
.big { font-size: 24px; }
.bigger { font-size: 40px; }
</style>
</head>
<body>
<h1>Great Big Words</h1>
<h2>by Michael Mark & Tom Chapin</h2>
<p>When I was a little kid,
a "<em class="big">diminutive juvenile</em>," <br>
I liked my folks to read to me,
I was an <em class="big">"eager bibliophile."</em></p>
</body>
</html>
