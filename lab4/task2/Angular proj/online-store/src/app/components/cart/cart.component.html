<main class="container py-4">
    <div class="cart-header mb-4">
        <h2 class="display-6 fw-bold">
            <i class="bi bi-cart3 me-2"></i>Моя корзина
        </h2>
        <hr class="my-3">
    </div>

    <div class="product_list row g-4">
        @for (product of cart; track product.id) {
        <div class="col-12">
            <div class="card shadow-sm hover-shadow border-0">
                <div class="row g-0 align-items-center">
                    <div class="col">
                        <app-product-item [product]="product" (deleteCart)="remove(product.id)" class="d-block">
                        </app-product-item>
                    </div>
                </div>
            </div>
        </div>
        } @empty {
        <div class="col-12">
            <div class="empty-cart text-center py-5">
                <div class="card bg-light border-0">
                    <div class="card-body">
                        <i class="bi bi-cart-x display-1 text-muted"></i>
                        <p class="lead mt-3 mb-0">Корзина пуста</p>

                    </div>
                </div>
            </div>
        </div>
        }
    </div>
</main>
