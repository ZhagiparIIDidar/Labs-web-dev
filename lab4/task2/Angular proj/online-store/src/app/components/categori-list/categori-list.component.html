<div class="container my-4">
    <div class="row g-3">
        @for (category of categories; track category.id) {
        <div class="col-12 col-sm-6 col-md-4 col-lg-3">
            <div class="card category-card h-100" (click)="selectCategory(category.id)"
                [class.active]="category.id === selectedCId">
                <div class="card-body text-center">
                    <h5 class="card-title">{{ category.name }}</h5>
                    <p class="card-text text-muted">ID: {{ category.id }}</p>
                    @if (category.id === selectedCId) {
                    <span class="badge bg-primary">Выбрано</span>
                    }
                </div>
            </div>
        </div>
        }
    </div>
</div>

@if (selectedCId) {
<div class="container my-4">
    <div class="row">
        <div class="col-12">
            <app-product-list [products]="products" [selectedcid]="selectedCId" (deleteList)="deleteFromList($event)">
            </app-product-list>
        </div>
    </div>
</div>
}
