<header>
    <a routerLink="/cart" target="_blank">
    </a>
</header>
<div class="categories">
    @for (category of categories; track category.id) {
    <div id="category_bl" (click)="selectCategory(category.id)" [class.active]="category.id === selectedCId">
        {{ category.name }}, c id: {{ selectedCId }}
    </div>
    }
</div>
@if (selectedCId) {
<div class="container text-center">
    <div class="row">
        <app-product-list [products]="products" [selectedcid]="selectedCId"
            (deleteList)="deleteFromList($event)"></app-product-list>
    </div>
</div>
}
