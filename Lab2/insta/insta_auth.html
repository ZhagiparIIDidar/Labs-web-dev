<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="instagram (1).png">
    <title>Instagram</title>
</head>

<body>
    <main>
        <div class="overview">
            <div class="logo">
                <img src="instagram.png" alt="">
            </div>

            <div class="hero">
                Посмотрите, какими моментами из жизни поделились ваши
                <span class="accent-red">близкие</span>
                <span class="accent-pink">друзья</span>.
            </div>
            <div class="photo">
                <img src="https://static.cdninstagram.com/rsrc.php/v4/yF/r/reN9rvYdLTB.png" alt="">
            </div>
        </div>
        <div class="auth-bl">
            <div class="tit">
                <label for="login">
                    <p class="title">Войти в Instagram</p>
                </label>
            </div>

            <input type="text" class="input" id="login" placeholder="Имя пользователя, номер телефона или эл. почта">

            <input type="password" class="input" placeholder="Пароль">

            <button class="btn-login">Войти</button>

            <button class="forgot">Забыли пороль?</button>

            <button class="btn-facebook">
                Войти через Facebook
            </button>

            <button class="btn-register">
                Создать новый аккаунт
            </button>

            <div class="meta"><img src="image.png" alt="">Meta</div>
        </div>

    </main>
    <footer class="meta-footer">
        <div class="footer-links">
            <a href="#">Meta</a>
            <a href="#">Информация</a>
            <a href="#">Блог</a>
            <a href="#">Вакансии</a>
            <a href="#">Помощь</a>
            <a href="#">API</a>
            <a href="#">Конфиденциальность</a>
            <a href="#">Условия</a>
            <a href="#">Места</a>
            <a href="#">Instagram Lite</a>
            <a href="#">Meta AI</a>
            <a href="#">Threads</a>
            <a href="#">Загрузка контактов и лица, не являющиеся пользователями</a>
            <a href="#">Meta Verified</a>
        </div>

        <div class="footer-bottom">
            <span>Русский ⌄</span>
            <span>© 2026 Instagram from Meta</span>
        </div>
    </footer>

</body>

</html>
